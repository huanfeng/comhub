name: Release

on:
  push:
    tags:
      - "v*"

# 默认只读；写权限只给真正要建 Release 的那个 job
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # 版本号只有一处：根 Cargo.toml 的 [workspace.package].version（各成员都是
      # version.workspace = true）。这里只校验不改写——发出去的包版本号必须和 tag
      # 对得上，宁可在这里拦住。
      #
      # tag 名经 env 传入、不拼进脚本正文：`${{ github.ref_name }}` 直接写进 run:
      # 时，一个精心构造的 tag 名就是一段要在 runner 上执行的代码。
      - name: Check tag matches Cargo.toml
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG -replace '^v', ''
          if ($tag -notmatch '^\d+\.\d+\.\d+$') {
            throw "tag ($tag) 不是 v<major>.<minor>.<patch> 形式"
          }
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $pkg = $meta.packages | Where-Object { $_.name -eq 'comhub' } | Select-Object -First 1
          if (-not $pkg) { throw "cargo metadata 里找不到包 comhub" }
          if ($tag -ne $pkg.version) {
            throw "tag ($tag) 与 workspace 版本 ($($pkg.version)) 不一致：先改 Cargo.toml 的 [workspace.package].version，再打 tag"
          }
          "version=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "版本: $tag"

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked --bins

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ver = $env:VERSION
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # 压缩包里**不套一层目录**。scoop 是直接解压到应用目录的，多一层壳就得靠
          # 清单里的 extract_dir，而那个值带版本号——自动更新的清单维护不了它。
          Compress-Archive -Force `
            -Path target\release\comhub.exe, target\release\comhubw.exe, README.md `
            -DestinationPath "dist\comhub-$ver-windows-x86_64.zip"
          Get-ChildItem dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true

  # 通知自己的 scoop 仓库更新清单。对端会自己去下载资产算 sha256，
  # 所以这里不传哈希，也就不存在两边算法或时序不一致的问题。
  notify-scoop-bucket:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scoop.json
          sparse-checkout-cone-mode: false

      - name: Send repository_dispatch to scoop-bucket
        env:
          VERSION: ${{ needs.release.outputs.version }}
          REPO: ${{ github.repository }}
          # 两个名字都认：本仓库用 SCOOP_BUCKET_GITHUB_TOKEN（与 apkhub 一致），
          # 姊妹项目 keyremap 用的是 SCOOP_TOKEN。少一个二选一的配置步骤。
          TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN || secrets.SCOOP_TOKEN }}
        run: |
          set -euo pipefail

          # 清单元数据就地读，不经由 step output 再拼回脚本正文
          APP=$(jq -er '.name' .github/scoop.json)
          BIN=$(jq -er '.bin' .github/scoop.json)
          DESCRIPTION=$(jq -er '.description' .github/scoop.json)
          HOMEPAGE=$(jq -er '.homepage' .github/scoop.json)
          LICENSE=$(jq -er '.license' .github/scoop.json)

          # app 会进资产文件名与清单文件名，收紧到文件名安全的字符
          if ! [[ "$APP" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::scoop.json 的 name 只能是小写字母、数字和连字符: $APP"
            exit 1
          fi

          # 先明说缺什么。否则空 token 只会换来一个 401，看不出是没配 secret
          if [ -z "$TOKEN" ]; then
            echo "::error::未配置 secret SCOOP_BUCKET_GITHUB_TOKEN (或 SCOOP_TOKEN)，需要一个对 huanfeng/scoop-bucket 有 contents:write 权限的 PAT"
            exit 1
          fi

          ASSET_NAME="$APP-$VERSION-windows-x86_64.zip"
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/huanfeng/scoop-bucket/dispatches" \
            -d "$(jq -n \
              --arg app "$APP" \
              --arg repo "$REPO" \
              --arg version "$VERSION" \
              --arg asset_name "$ASSET_NAME" \
              --arg bin "$BIN" \
              --arg description "$DESCRIPTION" \
              --arg homepage "$HOMEPAGE" \
              --arg license "$LICENSE" \
              '{
                event_type: "update-scoop-manifest",
                client_payload: {
                  app: $app,
                  repo: $repo,
                  version: $version,
                  asset_name: $asset_name,
                  bin: $bin,
                  description: $description,
                  homepage: $homepage,
                  license: $license
                }
              }'
            )"
