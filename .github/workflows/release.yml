name: Release

on:
  push:
    tags:
      - "v*"

# 新建 Release 需要写权限，新版 GitHub 默认只给只读
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # 版本号只有一处：根 Cargo.toml 的 [workspace.package].version（各成员都是
      # version.workspace = true）。这里只校验不改写——发出去的包版本号必须和 tag
      # 对得上，宁可在这里拦住。
      - name: Check tag matches Cargo.toml
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $pkg = $meta.packages | Where-Object { $_.name -eq 'comhub' } | Select-Object -First 1
          if (-not $pkg) { throw "cargo metadata 里找不到包 comhub" }
          if ($tag -ne $pkg.version) {
            throw "tag ($tag) 与 workspace 版本 ($($pkg.version)) 不一致：先改 Cargo.toml 的 [workspace.package].version，再打 tag"
          }
          "version=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "版本: $tag"

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked --bins

      - name: Package
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # 压缩包里**不套一层目录**。scoop 是直接解压到应用目录的，多一层壳就得靠
          # 清单里的 extract_dir，而那个值带版本号——自动更新的清单维护不了它。
          Compress-Archive -Force `
            -Path target\release\comhub.exe, target\release\comhubw.exe, README.md `
            -DestinationPath "dist\comhub-$ver-windows-x86_64.zip"
          Get-ChildItem dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true

  # 通知自己的 scoop 仓库更新清单。对端会自己去下载资产算 sha256，
  # 所以这里不传哈希，也就不存在两边算法或时序不一致的问题。
  notify-scoop-bucket:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scoop.json
          sparse-checkout-cone-mode: false

      - name: Read scoop.json
        id: scoop
        run: |
          set -euo pipefail
          for key in name bin description homepage license; do
            echo "$key=$(jq -er ".$key" .github/scoop.json)" >> "$GITHUB_OUTPUT"
          done

      - name: Send repository_dispatch to scoop-bucket
        env:
          VERSION: ${{ needs.release.outputs.version }}
          APP: ${{ steps.scoop.outputs.name }}
          ASSET_NAME: "${{ steps.scoop.outputs.name }}-${{ needs.release.outputs.version }}-windows-x86_64.zip"
          # 两个名字都认：本仓库用 SCOOP_BUCKET_GITHUB_TOKEN（与 apkhub 一致），
          # 姊妹项目 keyremap 用的是 SCOOP_TOKEN。少一个二选一的配置步骤。
          TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN || secrets.SCOOP_TOKEN }}
        run: |
          set -euo pipefail
          # 先明说缺什么。否则空 token 只会换来一个 401，看不出是没配 secret
          if [ -z "$TOKEN" ]; then
            echo "::error::未配置 secret SCOOP_BUCKET_GITHUB_TOKEN (或 SCOOP_TOKEN)，需要一个对 huanfeng/scoop-bucket 有 contents:write 权限的 PAT"
            exit 1
          fi
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/huanfeng/scoop-bucket/dispatches" \
            -d "$(jq -n \
              --arg app "$APP" \
              --arg repo "${{ github.repository }}" \
              --arg version "$VERSION" \
              --arg asset_name "$ASSET_NAME" \
              --arg bin "${{ steps.scoop.outputs.bin }}" \
              --arg description "${{ steps.scoop.outputs.description }}" \
              --arg homepage "${{ steps.scoop.outputs.homepage }}" \
              --arg license "${{ steps.scoop.outputs.license }}" \
              '{
                event_type: "update-scoop-manifest",
                client_payload: {
                  app: $app,
                  repo: $repo,
                  version: $version,
                  asset_name: $asset_name,
                  bin: $bin,
                  description: $description,
                  homepage: $homepage,
                  license: $license
                }
              }'
            )"
